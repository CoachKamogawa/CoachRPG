plugins {
    id "java"
}

group = "com.magicera"
version = "0.1.0"

repositories {
    mavenCentral()
    maven { url = "https://repo.papermc.io/repository/maven-public/" }
}

dependencies {
    compileOnly("io.papermc.paper:paper-api:1.21.4-R0.1-SNAPSHOT")

    // Local Vault jar for compile
    compileOnly(files("libs/Vault.jar"))

    // Local MagicSpells jar for compile
    compileOnly(files("libs/MagicSpells-4.0-Beta-17.jar"))
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}

tasks.jar {
    archiveBaseName.set("MagicEraGuilds")
}

tasks.register("packagePluginZip", Zip) {
    dependsOn(tasks.jar)
    archiveBaseName.set("MagicEraGuilds")
    archiveVersion.set(project.version.toString())
    destinationDirectory.set(layout.buildDirectory.dir("distributions"))

    // Put the built jar into a /plugins folder inside the zip
    from(tasks.jar) {
        into("plugins")
    }

    // Include README at the root of the zip (if it exists)
    from("README.md")
}

tasks.assemble {
    dependsOn(tasks.named("packagePluginZip"))
}
