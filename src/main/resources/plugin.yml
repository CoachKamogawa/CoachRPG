name: CoachRPG
main: com.magicera.guilds.MagicEraGuildsPlugin
version: 1.0.0
api-version: "1.21"

commands:
  guild:
    description: Guild commands
    usage: /guild
  align:
    description: Open the alignment menu
    usage: /align

permissions:
  magicera.admin:
    default: op
  shieldcd.admin:
    default: op

  party:
    description: Party command
    usage: /party
    permission: magicera.party.use

  duel:
    description: Duel command
    usage: /duel
    permission: magicera.duel.use

  alignment:
    description: Alignment admin command
    usage: /alignment <get|set|add> <player> [amount]
    permission: magicera.admin

permissions:
  magicera.guilds.use:
    default: true
  magicera.party.use:
    default: true
  magicera.duel.use:
    default: true
  magicera.admin:
    default: op
