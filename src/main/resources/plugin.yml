name: MagicEraGuilds
main: com.magicera.guilds.MagicEraGuildsPlugin
version: 1.0.0
api-version: 1.21
author: Coach Kamogawa

commands:
  guild:
    description: Guild commands
    usage: /guild
  favor:
    description: Favor
    usage: /favor 

permissions:
  magicera.admin:
    default: op
  shieldcd.admin:
    default: op

  party:
    description: Party command
    usage: /party
    permission: magicera.party.use

  duel:
    description: Duel command
    usage: /duel
    permission: magicera.duel.use

  favor:
    description: Favor admin command
    usage: /favor <get|set|add> <player> [amount]
    permission: magicera.admin

permissions:
  magicera.guilds.use:
    default: true
  magicera.party.use:
    default: true
  magicera.duel.use:
    default: true
  magicera.admin:
    default: op
