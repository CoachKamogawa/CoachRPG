# Foundation config (we'll expand later)
data:
  save-interval-seconds: 120

guilds:
  inactivity-autodisbands-days: 30

claims:
  leader-start-chunks: 4
  power-max-per-player: 15
  member-chunks-per-10-power: 1
  chunk-cost: 75

economy:
  enabled: true
  vault-required: true
alignment:
  warn-interval-minutes: 30
  out-of-alignment-grace-hours: 48

  messages:
    honorable:
      login: "&a[Guild] &fYou are out of alignment for your guild. You have &e%timeleft%&f remaining to fix it."
      repeat: "&a[Guild] &fOut of alignment. Time left: &e%timeleft%&f."
    neutral:
      login: "&7[Guild] &fYou are out of alignment for your guild. You have &e%timeleft%&f remaining to fix it."
      repeat: "&7[Guild] &fOut of alignment. Time left: &e%timeleft%&f."
    dark:
      login: "&c[Guild] &fYou are out of alignment for your guild. You have &e%timeleft%&f remaining to fix it."
      repeat: "&c[Guild] &fOut of alignment. Time left: &e%timeleft%&f."
